# ─────────────────────────────────────────────────────────
#  Pipeline comparison config
#  Truth  = rare_disease / GIAB benchmark  (sensitivity denominator)
#  Query  = varient_piper                  (precision denominator)
# ─────────────────────────────────────────────────────────

# Samples to run SNV comparison for
snv_samples:
  - DNA_01
  - HG002

# Samples to run SV comparison for (only those with SV VCFs for both pipelines)
sv_samples:
  - DNA_01
  - HG002

# ── SNV input VCFs ────────────────────────────────────────
input_vcfs:
  rare_disease:
    DNA_01: "input_data/rare_disease/DNA_01/SNV/case_A4842_DNA_01_snv.vcf.gz"
    HG002:  "input_data/benchmarks/HG002/SNV/HG002_GRCh38_1_22_v4.2.1_benchmark.vcf.gz"
  varient_piper:
    DNA_01: "input_data/varient_piper/DNA_01/SNV/A4842.vcf.gz"
    HG002:  "input_data/varient_piper/HG002/SNV/HG002.vcf.gz"

# ── High-confidence BED files (per sample) ───────────────
# Used to restrict comparison to trusted regions before bcftools isec.
# Critical for GIAB benchmarking — leave empty string for samples without one.
high_confidence_bed:
  DNA_01: ""
  HG002:  "input_data/benchmarks/HG002/SNV/HG002_GRCh38_1_22_v4.2.1_benchmark_noinconsistent.bed"

# ── SV input VCFs ─────────────────────────────────────────
input_svs:
  rare_disease:
    DNA_01: "input_data/rare_disease/DNA_01/SV/case_A4842_DNA_01_sv.vcf.gz"
    HG002:  "input_data/benchmarks/HG002/SV/HG002_GRCh38_CMRG_SV_v1.00.vcf.gz"
  varient_piper:
    DNA_01: "input_data/varient_piper/DNA_01/SV/A4842.sv.vcf.gz"
    HG002:  "input_data/varient_piper/HG002/SV/HG002.manta.sv.vcf.gz"

# ── High-confidence BED files for SV (per sample) ─────────
# Restricts Truvari comparison to trusted regions.
sv_high_confidence_bed:
  DNA_01: ""
  HG002:  "input_data/benchmarks/HG002/SV/HG002_GRCh38_CMRG_SV_v1.00.bed"

# ── Reference FASTA ───────────────────────────────────────
# For bcftools norm left-alignment and truvari --pctseq (leave empty to skip)
reference: ""

# ── Truvari benchmarking parameters ──────────────────────
truvari:
  refdist: 500    # max breakpoint distance (bp)
  pctsize: 0.7    # minimum size similarity (0–1)
  pctseq: 0.0     # sequence similarity — keep 0 unless reference is set above
  sizemin: 50     # minimum SV size to consider (bp)

# ── Variant filtering ─────────────────────────────────────
# Restrict to PASS variants. For GIAB (HG002), the BED file above is the
# primary quality filter — filter_pass is still applied but less critical.
filter_pass: true

# ── Tool paths ────────────────────────────────────────────
bcftools_bin: "/root/miniforge3/envs/dsd_snv_pipeline/bin/bcftools"

# ── Output locations ──────────────────────────────────────
results_dir: "results"
