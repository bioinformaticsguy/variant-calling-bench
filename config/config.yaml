# ─────────────────────────────────────────────────────────────────────────────
#  Variant Calling Benchmark Config
#
#  Truth = HG002 GIAB benchmark
#  Query = VarientPiper in-house pipeline
#
#  SNV and SV benchmarking run automatically for whichever pipelines
#  have an `snv:` / `sv:` key — no separate list needed.
# ─────────────────────────────────────────────────────────────────────────────

# ── Truth set: HG002 GIAB ─────────────────────────────────────────────────────
truth:
  name: "HG002"
  snv:
    vcf: "input_data/truth/HG002/SNV/HG002_GRCh38_1_22_v4.2.1_benchmark.vcf.gz"
    bed: "input_data/truth/HG002/SNV/HG002_GRCh38_1_22_v4.2.1_benchmark_noinconsistent.bed"
  # CMRG: 273 medically relevant genes, ~250 SVs — good for clinical validation
  sv:
    vcf: "input_data/truth/HG002/SV/HG002_GRCh38_CMRG_SV_v1.00.vcf.gz"
    bed: "input_data/truth/HG002/SV/HG002_GRCh38_CMRG_SV_v1.00.bed"
  # T2T Q100 Draft Benchmark (2024-07-18): genome-wide, assembly-based
  # Better coverage for short-read callers — use _stvar BED for SVs
  # Download first: bash install_truth_set.sh --sv-tier1
  # sv:
  #   vcf: "input_data/truth/HG002/SV_Tier1/GRCh38_HG2-T2TQ100-V1.1.vcf.gz"
  #   bed: "input_data/truth/HG002/SV_Tier1/GRCh38_HG2-T2TQ100-V1.1_stvar.benchmark.bed"

# ── SV truth-set comparison ──────────────────────────────────────────────────
# These truth sets are benchmarked side-by-side for every SV query callset and
# every enabled GGtyped certainty threshold. Outputs go under:
#   results/sv_truths/{truthset}/...
sv_truths:
  cmrg:
    name: "HG002 CMRG SV v1.00"
    vcf: "input_data/truth/HG002/SV/HG002_GRCh38_CMRG_SV_v1.00.vcf.gz"
    bed: "input_data/truth/HG002/SV/HG002_GRCh38_CMRG_SV_v1.00.bed"
  sv_tier1:
    name: "HG002 SV Tier1"
    vcf: "input_data/truth/HG002/SV_Tier1/GRCh38_HG2-T2TQ100-V1.1.vcf.gz"
    bed: "input_data/truth/HG002/SV_Tier1/GRCh38_HG2-T2TQ100-V1.1_stvar.benchmark.bed"

# ── Pipeline to benchmark ─────────────────────────────────────────────────────
# The key name ("varient_piper") is used as the output folder name and in
# plot titles. Add an `snv:` key to enable SNV benchmarking, `sv:` for SV.
# Override paths at submission time without editing this file:
#   sbatch submit_job.sh --snv /path/to/HG002.vcf.gz --sv /path/to/HG002.sv.vcf.gz
pipelines:
  varient_piper:
    snv: "input_data/varient_piper/SNV/HG002.vcf.gz"
    sv:  "input_data/varient_piper/SV/HG002.manta.sv.vcf.gz"

# ── GGtyped SV certainty threshold comparison ────────────────────────────────
# Use the annotated VCF because it retains all genotyped calls plus the
# GGT_MAX_CERT/GGT_GT annotations needed to apply multiple certainty cutoffs.
ggtyped:
  enabled: true
  name: "GGtyped"
  vcf: "input_data/GGTyped/out_ggtyper_annotated.vcf.gz"
  genotype_tsv: "input_data/GGTyped/out_genotype_results.tsv.gz"
  certainty_thresholds: [0.5, 0.7, 0.8, 0.9, 0.95]
  keep_genotypes: ["REF/VAR", "VAR/VAR"]

# ── Reference FASTA ───────────────────────────────────────────────────────────
# For bcftools norm left-alignment and truvari --pctseq.
# Leave empty to skip; keep pctseq: 0.0 when no reference is set.
reference: ""

# ── Variant filtering ─────────────────────────────────────────────────────────
# Restrict VarientPiper output to PASS variants before comparison.
# Truth (HG002) is never PASS-filtered — its BED is the quality gate.
filter_pass: true

# ── Truvari SV benchmarking parameters ───────────────────────────────────────
truvari:
  refdist: 500    # max breakpoint distance (bp)
  pctsize: 0.7    # minimum size similarity [0–1]
  pctseq:  0.0    # sequence similarity — set to 0.7 only when reference is set
  sizemin: 50     # minimum SV size to consider (bp)

# ── Tool paths ────────────────────────────────────────────────────────────────
bcftools_bin: "bcftools"

# ── Output directory ──────────────────────────────────────────────────────────
results_dir: "results"
